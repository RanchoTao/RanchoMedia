name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install development dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps -e ./RanchoMediaOS -e ./RanchoMedia-WeChatPlatform
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix RanchoMedia-WeChatPlatform/desktop
      - name: Verify source, tests, types and desktop build
        run: ./scripts/verify.ps1 -Python (Get-Command python).Source
      - name: Full-history credential scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'gitleaks'
          New-Item -ItemType Directory -Force -Path $toolRoot | Out-Null
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_windows_x64.zip --dir $toolRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Join-Path $toolRoot 'gitleaks_8.30.1_windows_x64.zip'
          $expected = 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Scanner checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $toolRoot 'bin')
          & (Join-Path $toolRoot 'bin/gitleaks.exe') git . --log-opts=--all --redact=100 --no-banner
