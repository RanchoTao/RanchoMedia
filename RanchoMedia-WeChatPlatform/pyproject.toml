[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "rancho-media-wechat-platform"
version = "1.3.0"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "tzdata>=2025.2; platform_system == 'Windows'"]

[project.optional-dependencies]
desktop = ["pywebview==6.2.1"]
desktop-build = ["pyinstaller==6.22.3"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[project.scripts]
rancho-wechat = "rancho_wechat.cli:main"
rancho-media-desktop = "rancho_wechat.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rancho_wechat = ["index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
